# Render blueprint for Scripture Guide.
#
# Two services from one repo:
#   verse-api  -- the Express backend (the only thing that talks to Gemini)
#   verse-web  -- the Expo app exported as a static site for browsers
#
# iOS and Android ship separately through EAS / the app stores; they build from
# the same frontend/ source and just need EXPO_PUBLIC_API_URL pointed at the API.
#
# Setup: Render Dashboard -> New -> Blueprint -> pick this repo.
# You will be prompted for GEMINI_API_KEY during creation (see below).

services:
  - type: web
    name: verse-api
    runtime: node

    # The repo root is the monorepo; the service lives one level down.
    rootDir: backend

    # Starter stays always on. On `free` the service spins down after ~15 min
    # idle and the next request pays a ~50s cold start, which the clients would
    # show as a hang -- neither the web nor the mobile app sets a fetch timeout.
    plan: starter

    # --include=dev is load-bearing. NODE_ENV=production (set below) makes
    # `npm ci` skip devDependencies, which is where typescript lives -- without
    # this flag the build fails with "tsc: not found".
    #
    # `npm run build` runs tsc AND the copy:data step that puts bible-kjv.json
    # into dist/. Both are required; the server throws on boot without the JSON.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # GET /health returns 200 once Express is listening. Render uses this to
    # decide a deploy succeeded and to route traffic away from bad instances.
    healthCheckPath: /health

    envVars:
      # Matches the Node version the code was built and tested against.
      - key: NODE_VERSION
        value: "24"

      - key: NODE_ENV
        value: production

      # sync: false means "prompt me, don't read it from this file". Render
      # asks for the value at blueprint creation and stores it encrypted.
      # Never put the real key in this file -- it is committed to the repo.
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      # PORT is injected by Render and read by src/index.ts. Do not set it.

  # ---------------------------------------------------------------------------
  # The browser build of the Expo app. Static files only -- no server, no
  # secrets. It calls verse-api above for everything.
  # ---------------------------------------------------------------------------
  - type: web
    name: verse-web
    runtime: static
    rootDir: frontend

    # app.json sets web.output = "static", so this pre-renders one HTML file per
    # route (index / explore / saved) into dist/ rather than a single SPA shell.
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist

    envVars:
      - key: NODE_VERSION
        value: "24"

      # Baked into the JS bundle at build time, so it is public by design -- it
      # is only a URL. The Gemini key never comes near this service.
      # Changing it requires a rebuild, not just a restart.
      - key: EXPO_PUBLIC_API_URL
        value: https://verse-api-kngh.onrender.com
